<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Editor</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      box-sizing: border-box;
    }

    button {
      background: black;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    img {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>AI Background Editor</h1>
    <p>Ganti background foto dengan AI</p>

    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" style="display:none;">

    <textarea id="prompt" placeholder="Contoh: ganti background menjadi pantai saat sunset"></textarea>

    <button id="generateBtn">
      ✨ Ganti Background
    </button>

    <p id="status"></p>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = "block";
      };

      reader.readAsDataURL(file);

      status.textContent = "Foto berhasil dipilih.";
