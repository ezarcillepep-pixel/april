<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.app {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #777;
}

.photos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.photo-box {
  border: 2px dashed #ccc;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}

.photo-box input {
  display: block;
  width: 100%;
  margin-top: 15px;
}

.preview {
  width: 100%;
  height: 220px;
  object-fit: cover;
  margin-top: 15px;
  border-radius: 12px;
  display: none;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#status {
  text-align: center;
  margin-top: 15px;
}

#result {
  margin-top: 20px;
}

#result img {
  width: 100%;
  border-radius: 15px;
}

@media (max-width: 500px) {
  .preview {
    height: 170px;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>AI Background Editor</h1>

<p class="subtitle">
Pilih dua foto untuk mengganti background
</p>

<div class="photos">

<div class="photo-box">
<strong>📷 Foto Utama</strong>

<input
  type="file"
  id="mainInput"
  accept="image/*"
>

<img
  id="mainPreview"
  class="preview"
  alt="Foto utama"
>
</div>


<div class="photo-box">
<strong>🌄 Background</strong>

<input
  type="file"
  id="bgInput"
  accept="image/*"
>

<img
  id="bgPreview"
  class="preview"
  alt="Background"
>
</div>

</div>


<button id="generateBtn" disabled>
✨ Ganti Background
</button>

<p id="status"></p>

<div id="result"></div>

</div>


<script>

const mainInput =
  document.getElementById("mainInput");

const bgInput =
  document.getElementById("bgInput");

const mainPreview =
  document.getElementById("mainPreview");

const bgPreview =
  document.getElementById("bgPreview");

const generateBtn =
  document.getElementById("generateBtn");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


function preview(input, image) {

  const file = input.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    image.src = e.target.result;

    image.style.display = "block";

    checkFiles();
  };

  reader.readAsDataURL(file);
}


mainInput.addEventListener("change", function() {

  preview(mainInput, mainPreview);

});


bgInput.addEventListener("change", function() {

  preview(bgInput, bgPreview);

});


function checkFiles() {

  if (
    mainInput.files.length > 0 &&
    bgInput.files.length > 0
  ) {

    generateBtn.disabled = false;

    status.textContent =
      "✓ Kedua foto sudah siap";

  } else {

    generateBtn.disabled = true;

  }
}


function fileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function() {

      const base64 =
        reader.result.split(",")[1];

      resolve(base64);

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });
}


generateBtn.addEventListener(
  "click",
  async function() {

    generateBtn.disabled = true;

    status.textContent =
      "⏳ AI sedang memproses foto...";

    result.innerHTML = "";

    try {

      const mainImage =
        await fileToBase64(mainInput.files[0]);

      const backgroundImage =
        await fileToBase64(bgInput.files[0]);


      const response = await fetch(
        "https://april-backend-nine.vercel.app/api/generate",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            mainImage: mainImage,
            backgroundImage: backgroundImage
          })
        }
      );


      const text = await response.text();

console.log("STATUS:", response.status);
console.log("RESPONSE:", text);

let data;

try {
  data = JSON.parse(text);
} catch {
  throw new Error(
    "Server mengirim respons: " + text
  );
}

if (!response.ok) {
  throw new Error(
    data.error ||
    data.message ||
    JSON.stringify(data)
  );
}


      if (!data.image) {

        throw new Error(
          "AI tidak mengembalikan gambar."
        );

      }


      const img =
        document.createElement("img");

      img.src =
        "data:" +
        data.image.mimeType +
        ";base64," +
        data.image.data;

      result.appendChild(img);

      status.textContent =
        "✅ Selesai!";


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ " + error.message;

    } finally {

      generateBtn.disabled = false;

    }

  }
);

</script>

</body>
</html>
