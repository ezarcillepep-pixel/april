<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.app {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #777;
}

.photos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.photo-box {
  border: 2px dashed #ccc;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}

.photo-box input {
  display: block;
  width: 100%;
  margin-top: 15px;
}

.preview {
  width: 100%;
  height: 220px;
  object-fit: cover;
  margin-top: 15px;
  border-radius: 12px;
  display: none;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 16px;
}

@media (max-width: 500px) {
  .photos {
    grid-template-columns: 1fr 1fr;
  }

  .preview {
    height: 170px;
  }
}
</style>
</head>

<body>

<div class="app">

<h1>AI Background Editor</h1>

<p class="subtitle">
Pilih foto utama dan foto background
</p>

<div class="photos">

<div class="photo-box">

<strong>📷 Foto Utama</strong>

<input
type="file"
id="mainInput"
accept="image/*"
>

<img
id="mainPreview"
class="preview"
>

</div>


<div class="photo-box">

<strong>🌄 Background</strong>

<input
type="file"
id="bgInput"
accept="image/*"
>

<img
id="bgPreview"
class="preview"
>

</div>

</div>

<button id="generateBtn" disabled>
✨ Ganti Background
</button>

<p id="status"></p>

</div>


<script>

const mainInput =
document.getElementById("mainInput");

const bgInput =
document.getElementById("bgInput");

const mainPreview =
document.getElementById("mainPreview");

const bgPreview =
document.getElementById("bgPreview");

const generateBtn =
document.getElementById("generateBtn");

const status =
document.getElementById("status");


mainInput.addEventListener("change", function() {

  const file = mainInput.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    mainPreview.src = e.target.result;
    mainPreview.style.display = "block";
    checkFiles();
  };

  reader.readAsDataURL(file);

});


bgInput.addEventListener("change", function() {

  const file = bgInput.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    bgPreview.src = e.target.result;
    bgPreview.style.display = "block";
    checkFiles();
  };

  reader.readAsDataURL(file);

});


function checkFiles() {

  if (
    mainInput.files.length > 0 &&
    bgInput.files.length > 0
  ) {

    generateBtn.disabled = false;

    status.textContent =
    "✓ Kedua foto sudah dipilih";

  }

}


generateBtn.addEventListener("click", function() {

  status.textContent =
  "Foto siap diproses.";

});

</script>

</body>
</html>
