<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed #ccc;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .upload-box:hover {
      background: #fafafa;
    }

    .upload-box input {
      display: none;
    }

    .preview {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI Background Editor</h1>

    <p class="subtitle">
      Gabungkan foto utama dengan background pilihanmu
    </p>

    <!-- FOTO UTAMA -->
    <label class="upload-box">
      📷<br>
      <strong>Pilih Foto Utama</strong>
      <br>
      <small>Foto orang atau objek</small>

      <input type="file" id="mainImage" accept="image/*">

      <img id="mainPreview" class="preview">
    </label>

    <!-- FOTO BACKGROUND -->
    <label class="upload-box">
      🌄<br>
      <strong>Pilih Foto
